<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Vertoone Omni</title>
    <link rel="icon" href="/brand-logo.png" type="image/png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #0a0a0a;
        --muted: #71717a;
        --border: #e4e4e7;
        --accent: #18181b;
        --accent-fg: #fafafa;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --fg: #fafafa;
          --muted: #a1a1aa;
          --border: #27272a;
          --accent: #fafafa;
          --accent-fg: #18181b;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .card {
        width: 100%;
        max-width: 26rem;
        text-align: center;
      }
      img {
        width: 3.5rem;
        height: 3.5rem;
        object-fit: contain;
      }
      h1 {
        margin: 1.25rem 0 0.5rem;
        font-size: 1.375rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        font-size: 0.9375rem;
        line-height: 1.6;
        color: var(--muted);
      }
      .status {
        margin-top: 1.5rem;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        border: 1px solid var(--border);
        border-radius: 9999px;
        padding: 0.375rem 0.875rem;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--muted);
      }
      .dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 9999px;
        background: #f59e0b;
      }
      button {
        margin-top: 1.5rem;
        width: 100%;
        border: 0;
        border-radius: 0.625rem;
        padding: 0.75rem 1rem;
        font: inherit;
        font-size: 0.9375rem;
        font-weight: 600;
        color: var(--accent-fg);
        background: var(--accent);
        cursor: pointer;
      }
      button:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/brand-logo.png" alt="" />
      <h1>You are offline</h1>
      <p>
        Vertoone Omni needs a connection to load this page. Pages you have already visited stay
        available — reconnect to pick up where you left off.
      </p>
      <div class="status"><span class="dot"></span> No network connection</div>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </div>
    <script>
      window.addEventListener("online", function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
