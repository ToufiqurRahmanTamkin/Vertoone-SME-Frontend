<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Single brand mark used for the tab icon, PWA/home-screen icon and app
         branding everywhere. -->
    <link rel="icon" href="/brand-logo.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="application-name" content="Vertoone Omni" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vertoone" />
    <link rel="apple-touch-icon" href="/brand-logo.png" />
    <link rel="mask-icon" href="/brand-logo.png" color="#0f0f0f" />
    <meta name="msapplication-TileColor" content="#0f0f0f" />
    <meta name="msapplication-TileImage" content="/brand-logo.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f0f" />

    <!-- Primary Meta Tags -->
    <title>Vertoone Omni</title>
    <meta name="description" content="Vertoone Omni — the super admin console for the Vertoone Omni platform." />

    <!-- Open Graph / Social Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vertoone Omni" />
    <meta property="og:title" content="Vertoone Omni" />
    <meta property="og:description" content="Vertoone Omni — the super admin console for the Vertoone Omni platform." />
    <meta property="og:image" content="/brand-logo.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Vertoone Omni" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vertoone Omni" />
    <meta name="twitter:description" content="Vertoone Omni — the super admin console for the Vertoone Omni platform." />
    <meta name="twitter:image" content="/brand-logo.png" />
    <meta name="twitter:image:alt" content="Vertoone Omni" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
